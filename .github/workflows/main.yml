name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Unpack zip
        run: |
          find . -name '*.zip' -not -path './.git/*' | while read -r z; do
            unzip -oq "$z" -d unpacked
          done

      - name: Build mod
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle не найден. Загрузи в репозиторий autotune-mod-project.zip"
            ls -R
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoTune-mod
          path: "**/build/libs/*.jar"
